<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Galería QR</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="hero-content">
      <p class="badge">Galería QR</p>
      <h1>Mis fotos</h1>
      <p>Toca una imagen para verla en grande y desliza para cambiar.</p>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Fotos disponibles</h2>
      <p>Selecciona una foto para abrir la galería.</p>
    </section>

    <section id="galeria" class="galeria"></section>
  </main>

  <div id="modal" class="modal">
    <button id="cerrarModal" class="modal-close">×</button>

    <button id="prevBtn" class="nav-btn nav-btn-left">‹</button>

    <div class="modal-content">
      <img id="imagenModal" src="" alt="Foto ampliada" />
      <p id="tituloModal"></p>
    </div>

    <button id="nextBtn" class="nav-btn nav-btn-right">›</button>
  </div>

  <footer>
    <p>Galería creada para escanear con QR</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
